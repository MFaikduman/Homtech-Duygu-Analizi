name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  training:
    name: Classical ML and dataset checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install uv==0.11.3
          uv sync --locked

      - name: Compile source
        run: uv run --no-sync python -m compileall -q src/homtech tests

      - name: Run dataset and training tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Check dependency compatibility
        run: uv pip check
