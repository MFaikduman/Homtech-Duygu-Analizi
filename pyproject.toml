[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homtech-duygu-analizi"
dynamic = ["version"]
description = "HOMTECH EmotionAI: yuz ifadesi siniflandirma ve akilli ev altyapisi."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "matplotlib",
  "scikit-learn",
  "joblib",
  "opencv-python>=4.10,<5",
  "Pillow",
  "PySide6-Essentials>=6.8,<7",
]

[project.scripts]
homtech-train = "homtech.ml.train:main"
homtech-evaluate = "homtech.ml.evaluate:main"
homtech-check-data = "homtech.ml.rafdb:main"
homtech-check-rafdb = "homtech.ml.rafdb:main"
homtech-train-rafdb = "homtech.ml.train:main"
homtech-evaluate-rafdb = "homtech.ml.evaluate:main"
homtech-experiment = "homtech.ml.experiment:main"
homtech-desktop = "homtech.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["homtech*"]

[tool.setuptools.dynamic]
version = {attr = "homtech.__version__"}
